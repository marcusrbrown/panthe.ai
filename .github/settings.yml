---
_extends: .github:common-settings.yaml

repository:
  name: panthe.ai
  description: Local-first simulation of autonomous mythological characters and their worlds
  homepage: https://panthe.ai
  topics: simulation, ai-agents, local-first, tauri, threejs, webgpu, bun, mythology

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - check
          - rust
          - Fro Bot
      enforce_admins: true
      # Require a pull request and one approval. Fro Bot reviews every
      # non-bot PR and its APPROVED/CHANGES_REQUESTED verdict is the gate;
      # PRs it skips (bot authors, forks) need an owner approval.
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      restrictions: null
      required_linear_history: true
