[package]
name = "panthea-desktop"
version = "0.1.0"
description = "Panthea — desktop shell"
authors = ["Marcus R. Brown"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "panthea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to 2.12.0, not the originally scaffolded 2.11.5: with 2.11.5, cargo
# resolved tauri-runtime/tauri-runtime-wry to 2.12.0 (published the same day)
# and the crate failed to compile against that mismatched internal API. 2.12.0
# is co-published across the whole tauri-* crate family and matches the JS
# @tauri-apps/api@2.12.0 / @tauri-apps/cli@2.12.0 pins below, so crate and API
# stay in lockstep with no version skew.
# `tray-icon`: the lifecycle probe's Show/Quit tray keeps the shell running
# after window close (ADR-0003) rather than quitting the whole app.
tauri = { version = "=2.12.0", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
