[package]
name = "panthea-probe-renderer"
version = "0.1.0"
description = "Panthea — M0 renderer probe (D25: three-flatland on WebGPURenderer's WebGL2 backend)"
authors = ["Marcus R. Brown"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "panthea_probe_renderer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to 2.12.0 to match @tauri-apps/api@2.12.0 / @tauri-apps/cli@2.12.0 —
# see apps/desktop/src-tauri/Cargo.toml for why 2.11.5 (the scaffolded
# default) resolves to a mismatched tauri-runtime-wry and fails to compile.
tauri = { version = "=2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
